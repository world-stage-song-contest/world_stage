{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block headercontents %}
    <link rel="stylesheet" href="{{ static('css/forms.css') }}">
{% endblock %}
{% block content %}
    {% if message %}
    <p class="error">{{ message|safe }}</p>
    {% endif %}
    <form method="POST">
        <fieldset class="grid">
            <label class="req" for="username">Username</label>
            <input type="text" id="username" name="username" required minlength="3" maxlength="64"
                   value="{{ username or '' }}">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" maxlength="254" value="{{ email or '' }}">
            <label class="req" for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <label class="req" for="password2">Repeat password</label>
            <input type="password" id="password2" name="password2" required>
        </fieldset>
        <input type="submit" value="Sign Up">
    </form>
{% endblock %}
