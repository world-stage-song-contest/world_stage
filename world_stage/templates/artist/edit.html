{% extends "base.html" %}
{% block title %}Edit {{ artist.display_name }}{% endblock %}
{% block headercontents %}<link rel="stylesheet" href="{{ static('css/forms.css') }}">{% endblock %}
{% block content %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
    <fieldset class="grid">
        <legend>Canonical identity</legend>
        <label class="req" for="full_name">Full name</label>
        <input id="full_name" name="full_name" required maxlength="150" value="{{ artist.full_name }}">
        <label for="native_name">Native-script name</label>
        <input id="native_name" name="native_name" maxlength="150" value="{{ artist.native_name or '' }}">
        <label class="req" for="number">Number</label>
        <input id="number" name="number" type="number" min="1" required value="{{ artist.number }}">
    </fieldset>
    <div class="buttons">
        <a class="button" href="{{ url_for('artist.details', name=artist.display_name) }}">Cancel</a>
        <button type="submit">Save</button>
    </div>
</form>
{% endblock %}
